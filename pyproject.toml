[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolyte-md-analysis"
version = "0.1.0"
description = "Coordination, dynamics, association, polymer-motion, and transport analysis for metal-ion polymer-electrolyte MD simulations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "MDAnalysis>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
